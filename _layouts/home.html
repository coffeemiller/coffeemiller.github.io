---
layout: archive
classes: wide
---

{{ content }}

<div class="main-post-list">
  {% if paginator %}
    {% assign posts = paginator.posts %}
  {% else %}
    {% assign posts = site.posts %}
  {% endif %}

  {% for post in posts %}
    {% include archive-single.html %}
  {% endfor %}

  {% include paginator.html %}
</div>

<style>
.main-post-list {
  max-width: 800px;
  margin: 0 auto;
  padding-bottom: 4em;
}
</style>
